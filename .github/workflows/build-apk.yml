name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Gradle build type
        default: Benchmark

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK, CMake, build-tools
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          NDK=$(grep '^ndk' gradle/tools.versions.toml | cut -d'"' -f2)
          CMAKE=$(grep '^cmake' gradle/tools.versions.toml | cut -d'"' -f2)
          BT=$(grep '^buildTools' gradle/tools.versions.toml | cut -d'"' -f2)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;$NDK" "build-tools;$BT" "cmake;$CMAKE" || $SDKM "ndk;$NDK" "build-tools;$BT"

      - name: Rust toolchain
        run: |
          RT=$(grep '^rustToolchain' gradle/tools.versions.toml | cut -d'"' -f2)
          rustup toolchain install "$RT" --profile minimal
          rustup default "$RT"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Fetch sherpa-onnx native libs
        run: bash tools/fetch-sherpa-onnx.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :app:assemble${{ inputs.variant }} --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dictate-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
